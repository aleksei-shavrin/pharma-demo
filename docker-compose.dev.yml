# Development stack: Next HMR + Nest watch + Docusaurus live reload + Caddy.
# Does NOT replace production-like: docker compose --profile app
#
# Start:  npm run dev
# Stop:   npm run dev:down
#
# Repo lives on Linux FS (WSL2); native file watching — no global polling.

networks:
  ppc-net:
    driver: bridge

volumes:
  ppc_dev_web_node_modules:
  ppc_dev_web_next:
  ppc_dev_api_node_modules:
  ppc_dev_api_dist:
  ppc_dev_docs_node_modules:

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - docs
      - web
      - api
    networks:
      - ppc-net

  docs:
    build:
      context: .
      dockerfile: website/Dockerfile.dev
    volumes:
      - ./website:/app/website
      - ./docs:/app/docs
      - ./openspec/specs:/app/openspec/specs
      - ppc_dev_docs_node_modules:/app/website/node_modules
    expose:
      - "3000"
    networks:
      - ppc-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api.localhost
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web:/app
      - ppc_dev_web_node_modules:/app/node_modules
      - ppc_dev_web_next:/app/.next
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - ppc-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      PORT: "3000"
      WEB_ORIGIN: http://localhost
    volumes:
      - ./apps/api:/app
      - ppc_dev_api_node_modules:/app/node_modules
      # Keep Nest emit off the bind mount (avoids root-owned host dist/).
      - ppc_dev_api_dist:/app/dist
    expose:
      - "3000"
    networks:
      - ppc-net
