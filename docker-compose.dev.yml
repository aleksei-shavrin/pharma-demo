# Development stack: Next HMR + Nest watch + Docusaurus live reload + Caddy.
# Single origin on HOST_PORT (default 3080): / → web, /backend → api, /docs → docs.
#
# Ports require root .env.local via CLI:
#   docker compose --env-file .env.local -f docker-compose.dev.yml up --build -d
# (npm run dev / dev:down / dev:logs wrap that.)
#
# Fallback project name below. Routine restarts must use scripts with
# `-p pharma-demo` (CLI `-p` / COMPOSE_PROJECT_NAME override `name:`).
# A different `-p` on this file creates a second stack.
#
# apps/web/.env.local is separate (native Next without Compose) and must not
# replace Compose --env-file for HOST_PORT.

name: pharma-demo

networks:
  ppc-net:
    driver: bridge

volumes:
  ppc_dev_web_node_modules:
  ppc_dev_web_next:
  ppc_dev_api_node_modules:
  ppc_dev_api_dist:
  ppc_dev_docs_node_modules:
  # Isolates Docusaurus generated cache from host bind mount so host
  # `npm run docs:build` (absolute host paths in .docusaurus) cannot break
  # the live docs container (expects /app/website/... paths).
  ppc_dev_docs_docusaurus:

services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${HOST_PORT:-3080}:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      - docs
      - web
      - api
    networks:
      - ppc-net

  docs:
    build:
      context: .
      dockerfile: website/Dockerfile.dev
    environment:
      DOCUSAURUS_BASE_URL: ${DOCUSAURUS_BASE_URL:-/docs/}
      DOCUSAURUS_URL: ${DOCUSAURUS_URL:-http://localhost:3080}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    volumes:
      - ./website:/app/website
      - ./docs:/app/docs
      - ./openspec/specs:/app/openspec/specs
      # Remark demote-out-of-tree-links imports scripts/lib (site-path helpers).
      - ./scripts:/app/scripts:ro
      - ppc_dev_docs_node_modules:/app/website/node_modules
      - ppc_dev_docs_docusaurus:/app/website/.docusaurus
    expose:
      - "3000"
    networks:
      - ppc-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/backend}
      NEXT_PUBLIC_DOCS_BASE_URL: ${NEXT_PUBLIC_DOCS_BASE_URL:-/docs/}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    volumes:
      - ./apps/web:/app
      - ppc_dev_web_node_modules:/app/node_modules
      - ppc_dev_web_next:/app/.next
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - ppc-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    env_file:
      - path: .env.dev-auth
        required: false
    environment:
      PORT: "3000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3080}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3080}
      PUBLIC_API_PREFIX: ${PUBLIC_API_PREFIX:-/backend}
      LOGIN_PASSWORD_HASH_FILE: /run/secrets/login-password-hash
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    volumes:
      - ./apps/api:/app
      - ppc_dev_api_node_modules:/app/node_modules
      # Keep Nest emit off the bind mount (avoids root-owned host dist/).
      # Named volume makes /app/dist a mount point — Nest deleteOutDir:true
      # fails with EBUSY; apps/api/nest-cli.json keeps deleteOutDir:false.
      - ppc_dev_api_dist:/app/dist
      - ./.dev-login-password-hash:/run/secrets/login-password-hash:ro
    expose:
      - "3000"
    networks:
      - ppc-net
