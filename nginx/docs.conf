server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prefer relative redirects; path must keep deployment prefix when not stripped.
    absolute_redirect off;
    port_in_redirect off;

    error_page 404 /404.html;

    # k3s / CI: Caddy forwards full /portal/* (no strip). baseUrl=/portal/
    # alias so trailing-slash redirects keep the /portal prefix.
    location = /portal {
        return 301 /portal/;
    }
    location /portal/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    # Compose: Caddy handle_path strips /docs → nginx sees /assets, /guides, …
    # (baseUrl=/docs/). Keep root locations for that mode.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /404.html {
        add_header Cache-Control "no-cache";
    }
}
