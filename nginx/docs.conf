server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy strips /portal before proxying; Docusaurus is built with baseUrl=/portal/
    # so browser requests /portal/assets/... → nginx sees /assets/...

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /404.html {
        add_header Cache-Control "no-cache";
    }
}
