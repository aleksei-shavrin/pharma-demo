<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Gantt interval lab</title>
    <link rel="stylesheet" href="/node_modules/dhtmlx-gantt/codebase/dhtmlxgantt.css" />
    <link rel="stylesheet" href="/src/components/schedule/dhtmlx-gantt-adapter.css" />
    <style>
      :root {
        --surface-raised: #f7f4ef;
        --surface-sunken: #efeae3;
        --text: #1c1915;
        --text-muted: #5c564e;
        --border: #c9c1b6;
        --border-subtle: #ddd6cc;
        --selected: #d7ebe8;
        --interactive: #e7f2f0;
        --radius-md: 8px;
      }
      html[data-theme='dark'] {
        --surface-raised: #1c1915;
        --surface-sunken: #141210;
        --text: #f3efe8;
        --text-muted: #b7b0a6;
        --border: #3d3832;
        --border-subtle: #2c2926;
        --selected: #23403c;
        --interactive: #1d3330;
      }
      body { margin: 16px; background: var(--surface-raised); color: var(--text); font: 14px/1.4 sans-serif; }
      #gantt { height: 280px; border: 1px solid var(--border); }
      .forecast { background: #2f6f7a; }
      .baseline { background: #8a8175; }
      .actual { background: #a33b32; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <p>Лаборатория интервалов. Не маршрут показа и не /schedule.</p>
    <div id="gantt" class="ppc-gantt-host"></div>
    <pre id="report">запуск…</pre>
    <script src="/node_modules/dhtmlx-gantt/codebase/dhtmlxgantt.js"></script>
    <script src="./lab.js"></script>
  </body>
</html>
