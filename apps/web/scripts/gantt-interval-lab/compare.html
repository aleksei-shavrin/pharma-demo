<!DOCTYPE html>
<html lang="ru" data-theme="light">

    <style>
      :root {
        --surface-raised: #f7f4ef;
        --surface-sunken: #efeae3;
        --text: #1c1915;
        --text-muted: #5c564e;
        --border: #c9c1b6;
        --border-subtle: #ddd6cc;
        --selected: #d7ebe8;
        --interactive: #e7f2f0;
        --radius-md: 8px;
      }
      body {
        margin: 16px;
