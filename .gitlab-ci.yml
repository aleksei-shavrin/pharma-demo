# vim: ft=yaml:ts=2:sw=2
---

stages:
  - docker
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  KUBECONFIG: $CI_PROJECT_DIR/.kube/config
  K8S_NAMESPACE: test
  IMAGE_WEB: $CI_REGISTRY_IMAGE/web
  IMAGE_API: $CI_REGISTRY_IMAGE/api
  IMAGE_DOCS: $CI_REGISTRY_IMAGE/docs
  PUBLIC_ORIGIN: https://[demo-host]

docker-build:
  stage: docker
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - 'echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'
  script:
    - |
      docker build \
        -t "$IMAGE_WEB:$CI_COMMIT_REF_SLUG" \
        -t "$IMAGE_WEB:latest" \
        --build-arg NEXT_PUBLIC_API_BASE_URL=/backend \
        -f apps/web/Dockerfile \
        apps/web
    - |
      docker build \
        -t "$IMAGE_API:$CI_COMMIT_REF_SLUG" \
        -t "$IMAGE_API:latest" \
        -f apps/api/Dockerfile \
        apps/api
    - |
      docker build \
        -t "$IMAGE_DOCS:$CI_COMMIT_REF_SLUG" \
        -t "$IMAGE_DOCS:latest" \
        --build-arg "DOCUSAURUS_URL=$PUBLIC_ORIGIN" \
        --build-arg DOCUSAURUS_BASE_URL=/portal/ \
        -f Dockerfile \
        .
    - docker push "$IMAGE_WEB:$CI_COMMIT_REF_SLUG"
    - docker push "$IMAGE_WEB:latest"
    - docker push "$IMAGE_API:$CI_COMMIT_REF_SLUG"
    - docker push "$IMAGE_API:latest"
    - docker push "$IMAGE_DOCS:$CI_COMMIT_REF_SLUG"
    - docker push "$IMAGE_DOCS:latest"
  only:
    - main

deploy-k3s:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  only:
    - main
  needs:
    - docker-build
  before_script:
    - mkdir -p .kube/
    - echo "$KUBECONFIG_BASE64" | base64 --decode > "$KUBECONFIG"
  script:
    - kubectl apply -k k8s
    - kubectl -n "$K8S_NAMESPACE" set image deployment/pharma-demo-web app="$IMAGE_WEB:latest"
    - kubectl -n "$K8S_NAMESPACE" set image deployment/pharma-demo-api app="$IMAGE_API:latest"
    - kubectl -n "$K8S_NAMESPACE" set image deployment/pharma-demo-docs app="$IMAGE_DOCS:latest"
    - kubectl -n "$K8S_NAMESPACE" rollout restart deployment/pharma-demo-web deployment/pharma-demo-api deployment/pharma-demo-docs deployment/pharma-demo-proxy
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/pharma-demo-api --timeout=180s
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/pharma-demo-web --timeout=180s
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/pharma-demo-docs --timeout=180s
    - kubectl -n "$K8S_NAMESPACE" rollout status deployment/pharma-demo-proxy --timeout=180s
