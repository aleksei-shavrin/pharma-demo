apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharma-demo
  namespace: test
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: [demo-host]
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pharma-demo-proxy
                port:
                  name: http
