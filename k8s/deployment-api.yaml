apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-demo-api
  namespace: test
  labels:
    app.kubernetes.io/name: pharma-demo-api
    app.kubernetes.io/part-of: pharma-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pharma-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharma-demo-api
        app.kubernetes.io/part-of: pharma-demo
    spec:
      imagePullSecrets:
        - name: dockerrebel
      containers:
        - name: app
          image: ghcr.io/example/pharma-demo/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: pharma-demo-api
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
