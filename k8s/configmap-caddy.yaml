apiVersion: v1
kind: ConfigMap
metadata:
  name: pharma-demo-caddy
  namespace: pharma
data:
  Caddyfile: |
    # Same path scheme as Caddyfile.server (ADR-0005).
    :80 {
    	encode gzip

    	redir /portal /portal/ 308
    	redir /backend /backend/ 308

    	handle_path /backend/* {
    		reverse_proxy pharma-demo-api:3000
    	}

    	# Do NOT strip /portal: docs image is built with baseUrl=/portal/.
    	# handle_path caused nginx trailing-slash 301 → /guides/… (Next 404).
    	handle /portal/* {
    		reverse_proxy pharma-demo-docs:80 {
    			header_up X-Forwarded-Proto {http.request.scheme}
    			header_up X-Forwarded-Host {host}
    		}
    	}

    	handle {
    		reverse_proxy pharma-demo-web:3000
    	}
    }
